# Dispositivos de telemetria (ESP32 real ou o mock publisher): só podem
# publicar no próprio tópico, nunca ler — nem esse nem qualquer outro.
user esp32_telemetria
topic write telemetria/esp32/data

# Consumidores (script de ingestão, Grafana Live via plugin MQTT): só podem
# ler o tópico de telemetria, nunca publicar.
user telemetria_reader
topic read telemetria/esp32/data

# Sem regra = acesso negado por padrão (comportamento padrão do Mosquitto
# quando acl_file está configurado).
